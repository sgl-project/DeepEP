name: Packaging checks

on:
  push:
    branches: [sgl-deepep-packaging]
  pull_request:
    branches: [sgl-deepep-packaging]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run packaging unit tests
        run: python -m unittest discover -s sgl_deep_ep/tests -v
